version: 1
backend:
  phases:
    build:
      commands:
        - nvm install 20.12.0
        - nvm use 20.12.0
        - echo "AMPLIFY_DATA_DEFAULT_NAME=$AMPLIFY_DATA_DEFAULT_NAME" >> .env
        - echo "API_ENDPOINT=$API_ENDPOINT" >> .env
        - echo "AUTHORIZATION_TYPE=$AUTHORIZATION_TYPE" >> .env
        - echo "AMPLIFY_DATA_GRAPHQL_ENDPOINT=$AMPLIFY_DATA_GRAPHQL_ENDPOINT" >> .env
        - echo "AMPLIFY_DATA_MODEL_INTROSPECTION_SCHEMA_BUCKET_NAME=$AMPLIFY_DATA_MODEL_INTROSPECTION_SCHEMA_BUCKET_NAME" >> .env
        - echo "AMPLIFY_DATA_MODEL_INTROSPECTION_SCHEMA_KEY=$AMPLIFY_DATA_MODEL_INTROSPECTION_SCHEMA_KEY" >> .env
        - cat .env
        - npm ci --cache .npm --prefer-offline --loglevel verbose
        - cd amplify/functions/autoSendServer/src && npm ci && cd -
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID

frontend:
  phases:
    preBuild:
      commands:
        - nvm install 20.12.0
        - nvm use 20.12.0
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .npm/**/*
      - dist/**/*
