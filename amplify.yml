version: 1
backend:
  phases:
    build:
      commands:
        - nvm install 20.12.0
        - nvm use 20.12.0
        - npm ci --cache .npm --prefer-offline
        - cd amplify/backend/function/autoSendServer/src && npm ci && cd -
        - amplifyPush --simple
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 20.12.0
        - nvm use 20.12.0
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .npm/**/*
      - dist/**/*
